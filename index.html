
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reisibüroo</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body class="wheel-body">
    <main class="page">
        <h1 class="island-title">Reisiloos</h1>

        <div class="wheel-container">
            <div class="pointer"></div>

            <div class="wheel" id="wheel">
                <div class="option option-1">Juustusaar</div>
                <div class="option option-2">Paradiisisaar</div>
                <div class="option option-3">Hollikas</div>
                <div class="option option-4">Kaleidoskoop</div>
                <div class="option option-5">Hawai</div>
                <div class="option option-6">Saaremaa</div>
            </div>

            <button class="center-circle" id="spinButton">
                VAJUTA
            </button>
        </div>
    </main>
</body>
</html>
